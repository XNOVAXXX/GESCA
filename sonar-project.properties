# Análisis de calidad con SonarQube (SonarQube Cloud o un servidor propio).
# Lo usa el job "SonarQube" del CI y también el escáner local (ver docs/calidad-sonarqube.md).
sonar.projectKey=XNOVAXXX_GESCA
sonar.organization=xnovaxxx
sonar.projectName=GESCA

# Código de la app (React Native / TypeScript) y del backend en Supabase (SQL y Edge Functions).
sonar.sources=app/src,supabase/migrations,supabase/functions
sonar.tests=app/src,supabase/tests
sonar.test.inclusions=app/src/**/*.test.ts,app/src/**/*.test.tsx,supabase/tests/**
sonar.exclusions=app/src/**/*.test.ts,app/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# Cobertura de las pruebas unitarias (la genera `npm run test:coverage` dentro de app/).
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
# Los archivos de estilos y las rutas solo conectan piezas; no aportan lógica que probar.
sonar.coverage.exclusions=app/src/**/*.styles.ts,app/src/**/*.view.tsx,app/src/app/**,app/src/compartido/tema/**,supabase/**
