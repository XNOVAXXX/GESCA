# Servidor de la app web. Todas las rutas (/panel, /acceso/ingresar, ...) las resuelve Expo Router
# dentro de index.html, así que Nginx devuelve index.html cuando no existe un archivo con ese nombre.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html /index.html;
  }

  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
